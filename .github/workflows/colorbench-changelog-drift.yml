# Daily check: does /projects/colorbench/changelog/ list the newest version from
# the upstream the-mini-colorbench CHANGELOG.md? If not, open (once) a
# ready-for-agent issue. The plain-language rewrite itself stays manual.
name: Colorbench changelog drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # keepalive: re-enable this workflow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare upstream and site versions
        env:
          # Upstream repo is private: fine-grained PAT, Contents: read on
          # phibu/the-mini-colorbench only.
          UPSTREAM_TOKEN: ${{ secrets.COLORBENCH_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$UPSTREAM_TOKEN" ]; then
            echo "::error::Secret COLORBENCH_READ_TOKEN is not set"; exit 1
          fi

          # Headings seen upstream: "## [2.6.0] —", "## [2.5.3] -", "## v1.7.9 —"
          up=$(GH_TOKEN="$UPSTREAM_TOKEN" gh api repos/phibu/the-mini-colorbench/contents/CHANGELOG.md \
                 -H "Accept: application/vnd.github.raw" \
               | grep -oE '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' \
               | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -1)
          site=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' projects/colorbench/changelog/index.html \
               | tr -d v | sort -uV | tail -1)
          echo "upstream=$up site=$site"
          [ -n "$up" ] || { echo "::error::No version found upstream"; exit 1; }
          [ "$up" = "$site" ] && exit 0

          title="Colorbench changelog drift: upstream v$up, site v$site"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "Already tracked in #$existing"
          else
            gh issue create --title "$title" --label ready-for-agent --body \
              "Upstream Colorbench is at **v$up**, the site changelog at **v$site**. Run the Colorbench changelog sync workflow from CLAUDE.md (plain-language rewrite, landing page number check)."
          fi

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repo activity. Re-enabling via the API resets that timer, without commits.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/colorbench-changelog-drift.yml/enable"
